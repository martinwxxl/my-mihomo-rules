rules:
- IP-CIDR,127.0.0.0/8,DIRECT,no-resolve
- IP-CIDR,10.0.0.0/8,DIRECT,no-resolve
- IP-CIDR,172.16.0.0/12,DIRECT,no-resolve
- IP-CIDR,192.168.0.0/16,DIRECT,no-resolve
- DOMAIN-SUFFIX,lan,DIRECT
- DOMAIN-SUFFIX,local,DIRECT
- RULE-SET,ads-classical,广告拦截
- RULE-SET,ai-classical,AI
- RULE-SET,emby-classical,Emby
- RULE-SET,streaming-classical,流媒体
- RULE-SET,apple-classical,Apple
- RULE-SET,social-classical,社交
- RULE-SET,development-classical,开发
- RULE-SET,domesticmedia-classical,国内媒体
- RULE-SET,domestic-classical,国内流量
- MATCH,默认代理
