name: Build and publish Mihomo rules

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    # 04:23 Asia/Shanghai daily; GitHub schedules may be delayed.
    - cron: '23 20 * * *'

permissions:
  contents: read

concurrency:
  group: rules-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
      - name: Install build dependencies
        run: python -m pip install -r requirements.txt
      - name: Verify and install pinned Mihomo
        run: python install_mihomo.py
      - name: Test normalization, conflicts, MRS semantics and original template invariants
        run: python -m unittest -v test_build
      - name: Read last successful release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python fetch_previous.py
      - name: Fetch, normalize, deduplicate, convert and validate
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          args=()
          if [[ -f previous/manifest.json ]]; then
            args+=(--previous previous/manifest.json)
          fi
          python build.py --mihomo runtime/mihomo --output dist "${args[@]}"
          python -c "from pathlib import Path; from publish import verify_dist; verify_dist(Path('dist'))"
      - name: Build summary
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          m = json.loads(Path('dist/manifest.json').read_text())
          c = json.loads(Path('dist/conflicts.json').read_text())
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as f:
              f.write('## Validated rules\n\nUpstream: `' + m['upstream_commit'] + '`\n\n')
              f.write('| Category | Rules |\n|---|---:|\n')
              for name, count in m['category_counts'].items():
                  f.write(f'| {name} | {count} |\n')
              f.write(f"\nExact duplicates removed: {len(c['exact_duplicates'])}; coverage overlaps: {len(c['coverage_overlaps'])}.\n")
              f.write('Both configurations passed mihomo -t and runtime loaded all nonempty YAML/MRS providers.\n')
          PY
      - name: Upload validated output
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: validated-rules
          path: dist/
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: validated-rules
          path: dist
      - name: Verify artifact and publish release atomically
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python publish.py
