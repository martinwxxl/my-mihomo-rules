# my-mihomo-rules OpenClash 覆写模块
# 在此模块的“环境变量/参数”中设置：EN_KEY1=主订阅地址;EN_KEY2=备用订阅地址
# 两条地址均为机场的 Clash/Mihomo 订阅，仅保存在路由器本地。
# 使用本模块时停用旧 Pro_cn_OpenClash_Overwrite_IPTV_IPv4 模块。

[General]
# 首次自动下载；每天北京时间 06:00 更新基础配置，并重启以重新应用覆写。
# 规则由自建仓库验证后发布；各 rule-provider 另有 24 小时自动刷新。
DOWNLOAD_FILE = url=https://raw.githubusercontent.com/martinwxxl/my-mihomo-rules/release/openclash-yaml.yaml, path=/etc/openclash/config/my-mihomo-rules.yaml, cron=0 6 * * *, force=false, restart=true
CONFIG_FILE = /etc/openclash/config/my-mihomo-rules.yaml
SUB_INFO_URL = $EN_KEY1
CORE_TYPE = Meta
PROXY_MODE = rule

[Overwrite]
# ENV 读取本地模块参数，避免把订阅凭据直接拼接进 Ruby 源码。
# 使用小写 primary / backup，与自建模板的主、备策略组完全一致。
# 订阅每小时刷新；节点健康检查每 60 秒，超时 5 秒，不采用 lazy 检查。
# 自建模板保留：主机场(url-test) -> 备机场(url-test) -> 固定优先级 fallback。
ruby_merge_hash "$CONFIG_FILE" "['proxy-providers']" "'primary'=>{'type'=>'http','url'=>ENV.fetch('EN_KEY1'),'path'=>'./proxy_provider/primary.yaml','interval'=>3600,'proxy'=>'DIRECT','header'=>{'User-Agent'=>['Clash.Meta']},'health-check'=>{'enable'=>true,'url'=>'https://www.gstatic.com/generate_204','interval'=>60,'timeout'=>5000,'lazy'=>false,'expected-status'=>204},'override'=>{'additional-prefix'=>'primary | '}},'backup'=>{'type'=>'http','url'=>ENV.fetch('EN_KEY2'),'path'=>'./proxy_provider/backup.yaml','interval'=>3600,'proxy'=>'DIRECT','header'=>{'User-Agent'=>['Clash.Meta']},'health-check'=>{'enable'=>true,'url'=>'https://www.gstatic.com/generate_204','interval'=>60,'timeout'=>5000,'lazy'=>false,'expected-status'=>204},'override'=>{'additional-prefix'=>'backup | '}}"

# 保留原模块的局域网代理端口访问设置。
ruby_edit "$CONFIG_FILE" "['allow-lan']" "true"
ruby_edit "$CONFIG_FILE" "['bind-address']" "'*'"

# 福建移动 IPTV 专用 IPv4 直连；重复应用时替换同名节点。
# 不修改全局 IPv6、DNS、Fake-IP 模式或已有 Fake-IP 排除项。
ruby_edit "$CONFIG_FILE" "['proxies']" "([{'name'=>'FJ-IPTV-IPv4','type'=>'direct','udp'=>true,'ip-version'=>'ipv4'}]+(Value['proxies']||[]).reject{|p| p['name']=='FJ-IPTV-IPv4'})"

# 一次插入全部高优先级规则，避免多个插入命令并发时顺序不确定。
# 其余自建分类规则和最终 MATCH 保留原顺序；重复应用时去重。
ruby_edit "$CONFIG_FILE" "['rules']" "(['DOMAIN-SUFFIX,fj.chinamobile.com,FJ-IPTV-IPv4','DOMAIN-SUFFIX,sntp.me,DIRECT','DOMAIN-KEYWORD,micu,DIRECT','DOMAIN-SUFFIX,micu.hk,DIRECT']+(Value['rules']||[])).uniq"
