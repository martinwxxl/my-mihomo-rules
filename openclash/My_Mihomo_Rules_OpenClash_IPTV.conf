# 公共模板：订阅地址仅从本地 EN_KEY1 / EN_KEY2 参数读取。
# Pro 中文版 OpenClash 覆写模块
# 环境变量：EN_KEY1=主订阅地址；EN_KEY2=备用订阅地址

[General]
# 每天 06:00 下载一次最新版 Pro 中文模板
DOWNLOAD_FILE = url=https://raw.githubusercontent.com/martinwxxl/my-mihomo-rules/release/openclash-yaml.yaml, path=/etc/openclash/config/Pro_cn.yaml, cron=0 6 * * *, force=false

# 将下载的模板设为本模块的覆写目标
CONFIG_FILE = /etc/openclash/config/Pro_cn.yaml

# 在 OpenClash 页面显示主订阅的流量与到期信息
SUB_INFO_URL = $EN_KEY1

[Overwrite]
# 创建主、备两个订阅提供者；各自每 24 小时更新一次
ruby_merge_hash "$CONFIG_FILE" "['proxy-providers']" "'Primary'=>{'type'=>'http','url'=>ENV.fetch('EN_KEY1'),'path'=>'./proxy_provider/Primary.yaml','interval'=>86400,'proxy'=>'DIRECT','header'=>{'User-Agent'=>['Clash.Meta']},'health-check'=>{'enable'=>true,'url'=>'https://www.google.com/generate_204','interval'=>300},'override'=>{'additional-prefix'=>'[P] '}}"

ruby_merge_hash "$CONFIG_FILE" "['proxy-providers']" "'Backup'=>{'type'=>'http','url'=>ENV.fetch('EN_KEY2'),'path'=>'./proxy_provider/Backup.yaml','interval'=>86400,'proxy'=>'DIRECT','header'=>{'User-Agent'=>['Clash.Meta']},'health-check'=>{'enable'=>true,'url'=>'https://www.google.com/generate_204','interval'=>300},'override'=>{'additional-prefix'=>'[B] '}}"

# 允许局域网设备访问 Mihomo 代理端口
ruby_edit "$CONFIG_FILE" "['allow-lan']" "true"
ruby_edit "$CONFIG_FILE" "['bind-address']" "'*'"

# 将直连规则插入 rules 数组最前面。
# 三次均插入索引 0，因此命令采用倒序书写，以得到下方目标顺序。
ruby_arr_insert "$CONFIG_FILE" "['rules']" "0" "DOMAIN-SUFFIX,micu.hk,DIRECT"
ruby_arr_insert "$CONFIG_FILE" "['rules']" "0" "DOMAIN-KEYWORD,micu,DIRECT"
ruby_arr_insert "$CONFIG_FILE" "['rules']" "0" "DOMAIN-SUFFIX,sntp.me,DIRECT"

# 福建移动 IPTV：限定此域名及子域名使用 IPv4 直连，优先于模板规则。
# 保留全局 IPv6、Fake-IP 和用户已配置的 Fake-IP 排除项。
ruby_arr_insert_hash "$CONFIG_FILE" "['proxies']" "0" "{'name'=>'FJ-IPTV-IPv4','type'=>'direct','udp'=>true,'ip-version'=>'ipv4'}"
ruby_arr_insert "$CONFIG_FILE" "['rules']" "0" "DOMAIN-SUFFIX,fj.chinamobile.com,FJ-IPTV-IPv4"
