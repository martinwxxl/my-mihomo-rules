mixed-port: 7890
allow-lan: true
mode: rule
log-level: info
ipv6: false
profile:
  store-selected: true
dns:
  enable: true
  listen: 127.0.0.1:7874
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter:
  - '*.lan'
  - '*.local'
  default-nameserver:
  - 223.5.5.5
  - 119.29.29.29
  nameserver:
  - https://dns.alidns.com/dns-query
  - https://doh.pub/dns-query
  proxy-server-nameserver:
  - https://dns.alidns.com/dns-query
proxy-providers:
  primary:
    type: file
    path: ./proxy_provider/primary.yaml
    override:
      additional-prefix: 'primary | '
    health-check:
      enable: true
      url: https://www.gstatic.com/generate_204
      interval: 60
      timeout: 5000
      lazy: false
      expected-status: 204
  backup:
    type: file
    path: ./proxy_provider/backup.yaml
    override:
      additional-prefix: 'backup | '
    health-check:
      enable: true
      url: https://www.gstatic.com/generate_204
      interval: 60
      timeout: 5000
      lazy: false
      expected-status: 204
proxy-groups:
- name: 主机场
  type: url-test
  use:
  - primary
  url: https://www.gstatic.com/generate_204
  interval: 60
  timeout: 5000
  tolerance: 50
  lazy: false
  expected-status: 204
- name: 备机场
  type: url-test
  use:
  - backup
  url: https://www.gstatic.com/generate_204
  interval: 60
  timeout: 5000
  tolerance: 50
  lazy: false
  expected-status: 204
- name: 机场故障转移
  type: fallback
  proxies:
  - 主机场
  - 备机场
  url: https://www.gstatic.com/generate_204
  interval: 60
  timeout: 5000
  lazy: false
  expected-status: 204
- name: 默认代理
  type: select
  proxies:
  - 机场故障转移
  - 主机场
  - 备机场
- name: AI
  type: select
  proxies:
  - 机场故障转移
  - 主机场
  - 备机场
  - DIRECT
- name: Emby
  type: select
  proxies:
  - 机场故障转移
  - 主机场
  - 备机场
  - DIRECT
- name: 流媒体
  type: select
  proxies:
  - 机场故障转移
  - 主机场
  - 备机场
  - DIRECT
- name: Apple
  type: select
  proxies:
  - 机场故障转移
  - 主机场
  - 备机场
  - DIRECT
- name: 社交
  type: select
  proxies:
  - 机场故障转移
  - 主机场
  - 备机场
  - DIRECT
- name: 开发
  type: select
  proxies:
  - 机场故障转移
  - 主机场
  - 备机场
  - DIRECT
